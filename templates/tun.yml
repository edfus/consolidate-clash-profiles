port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
experimental:
  ignore-resolve-fail: true
proxies: []
proxy-groups:
  - name: Proxy
    type: select
    proxies: []
  - name: Netflix
    type: select
    proxies:
      - Proxy
  - name: OpenAI
    type: select
    proxies:
      - Proxy
  - name: miHoYo
    type: select
    proxies:
      - Proxy
  - name: Nintendo
    type: select
    proxies:
      - Proxy
      - DIRECT
  - name: Bilibili
    type: select
    proxies:
      - DIRECT
      - Proxy
  - name: Steam
    type: select
    proxies:
      - Proxy
  - name: Facebook
    type: select
    proxies:
      - Proxy
  - name: Ad Blocking
    type: select
    proxies: 
      - REJECT
      - Proxy
  - name: Hong Kong
    type: select
    proxies: 
      - DIRECT
      - Proxy
  - name: Mainland China
    type: select
    proxies: 
      - DIRECT
      - Proxy
  - name: P2P Gaming
    type: select
    proxies: 
      - DIRECT
      - Proxy
  - name: P2P Applications
    type: select
    proxies: 
      - DIRECT
      - Proxy
  - name: Quick UDP Internet Connections
    type: select
    proxies:
      - REJECT
      - Proxy
  - name: Microsoft Network Connectivity Status Indicator
    type: select
    proxies:
      - Proxy
      - DIRECT
script:
  shortcuts:
    QUIC: network == 'udp' and dst_port == 443 and (geoip(resolve_ip(host)) != 'CN' or geoip(dst_ip) != 'CN')
    StarRail: network == 'udp' and dst_port == 23301
    # PrivateCompanyMonitor: network == 'tcp' and dst_port == 2000
    PrivateCompanyVPNHongKong: network == 'tcp' and dst_port == 441 # 202.77
rules:
  - SCRIPT,QUIC,Quick UDP Internet Connections,no-resolve
  - SCRIPT,StarRail,miHoYo,no-resolve
  - SCRIPT,PrivateCompanyVPNHongKong,P2P Applications,no-resolve
  - DOMAIN,dns.msftncsi.com,Microsoft Network Connectivity Status Indicator
  - DOMAIN,www.msftncsi.com,Microsoft Network Connectivity Status Indicator
  - DOMAIN,www.msftconnecttest.com,Microsoft Network Connectivity Status Indicator
  - DOMAIN,ipv6.msftconnecttest.com,Microsoft Network Connectivity Status Indicator
  - RULE-SET,Reject,Ad Blocking
  - RULE-SET,P2P Applications,P2P Applications
  - RULE-SET,P2P Gaming,P2P Gaming
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Facebook,Facebook
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Steam,Steam
  - RULE-SET,Bilibili,Bilibili
  - RULE-SET,Nintendo,Nintendo
  - RULE-SET,Mihoyo,miHoYo
  - RULE-SET,Hong Kong,Hong Kong
  - RULE-SET,Proxy,Proxy
  - RULE-SET,Mainland China,Mainland China
  - RULE-SET,Private Network,DIRECT
  - DOMAIN,localhost,DIRECT
  - DOMAIN-SUFFIX,local,DIRECT
  - DOMAIN-SUFFIX,lan,DIRECT
  - GEOIP,CN,Mainland China,no-resolve
  - MATCH,Proxy
